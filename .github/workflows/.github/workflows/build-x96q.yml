name: Build X96Q DDR3 6.12

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          echo "Before:"
          df -h /

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache

          sudo apt-get clean

          echo "After:"
          df -h /

      - name: Checkout NickAlilovic build
        uses: actions/checkout@v4
        with:
          repository: NickAlilovic/build
          ref: v20250306
          fetch-depth: 1

      - name: Show source
        run: |
          git log -1 --oneline
          echo
          cat config/boards/x96q-ddr3.csc

      - name: Build X96Q DDR3
        run: |
          sudo ./compile.sh build \
            BOARD=x96q-ddr3 \
            BRANCH=edge \
            RELEASE=bookworm \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            EXPERT=yes \
            COMPRESS_OUTPUTIMAGE=xz

      - name: Show output
        if: always()
        run: |
          echo "===== DISK ====="
          df -h

          echo
          echo "===== OUTPUT ====="
          find output -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Upload image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X96Q-DDR3-6.12
          path: |
            output/images/*.img
            output/images/*.img.xz
            output/images/*.sha
          if-no-files-found: error
          retention-days: 7
