name: Build Noble X96 Mate 6.12

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. FREE DISK SPACE
      # =========================================================
      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean

          echo "===== DISK AFTER CLEANUP ====="
          df -h


      # =========================================================
      # 2. CHECKOUT SOURCE X96Q ĐANG HOẠT ĐỘNG
      # =========================================================
      - name: Checkout X96Q source
        uses: actions/checkout@v4
        with:
          ref: v20250306
          fetch-depth: 1


      # =========================================================
      # 3. TẠO BOARD MỚI: x96-mate
      #
      # Copy nguyên cấu hình x96q-ddr3 đang hoạt động
      # rồi CHỈ đổi BOARD_NAME.
      #
      # Không thay DTB
      # Không thay U-Boot defconfig
      # Không thay WiFi extension
      # =========================================================
      - name: Create X96 Mate board
        shell: bash
        run: |
          set -e

          echo "===== ORIGINAL BOARD ====="
          cat config/boards/x96q-ddr3.csc

          echo
          echo "===== COPY BOARD ====="

          cp \
            config/boards/x96q-ddr3.csc \
            config/boards/x96-mate.csc

          sed -i \
            's/BOARD_NAME="X96Q DDR3"/BOARD_NAME="X96 Mate"/' \
            config/boards/x96-mate.csc

          echo
          echo "===== NEW X96 MATE BOARD ====="
          cat config/boards/x96-mate.csc

          echo
          echo "===== VERIFY BOARD NAME ====="

          grep '^BOARD_NAME=' \
            config/boards/x96-mate.csc

          echo
          echo "===== VERIFY DTB ====="

          grep 'BOOT_FDT_FILE' \
            config/boards/x96-mate.csc

          echo
          echo "===== VERIFY BOOTCONFIG ====="

          grep '^BOOTCONFIG=' \
            config/boards/x96-mate.csc


      # =========================================================
      # 4. FIX UBUNTU NOBLE BASE-FILES
      #
      # Đây là workaround cho lỗi build trước:
      #
      # Could not find package filename for 'base-files'
      #
      # Chỉ áp dụng cho Noble arm64.
      # =========================================================
      - name: Patch Noble base-files lookup
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "lib/functions/artifacts/"
              "artifact-armbian-base-files.sh"
          )

          text = path.read_text()

          old = (
              'sleep_seconds="15" do_with_retries 10 '
              'apt_find_upstream_package_version_and_download_url '
              '"base-files"'
          )

          new = '''if [[ "${RELEASE}" == "noble" && "${ARCH}" == "arm64" ]]; then
              display_alert "Using fixed Ubuntu Noble base-files URL" "base-files" "info"

              found_package_version="13ubuntu10"
              found_package_filename="base-files_13ubuntu10_arm64.deb"
              found_package_down_url="https://ports.ubuntu.com/ubuntu-ports/pool/main/b/base-files/base-files_13ubuntu10_arm64.deb"
          else
              sleep_seconds="15" do_with_retries 10 apt_find_upstream_package_version_and_download_url "base-files"
          fi'''

          if old not in text:
              raise SystemExit(
                  "ERROR: Cannot find original base-files lookup line"
              )

          text = text.replace(old, new, 1)

          path.write_text(text)

          print("PATCH BASE-FILES: OK")
          PY

          echo
          echo "===== VERIFY PATCH ====="

          grep -n \
            -A12 \
            -B3 \
            "Using fixed Ubuntu Noble" \
            lib/functions/artifacts/artifact-armbian-base-files.sh


      # =========================================================
      # 5. TEST FILE BASE-FILES TRƯỚC KHI BUILD
      # =========================================================
      - name: Test Noble base-files
        shell: bash
        run: |
          set -e

          URL="https://ports.ubuntu.com/ubuntu-ports/pool/main/b/base-files/base-files_13ubuntu10_arm64.deb"

          echo "Downloading:"
          echo "$URL"

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "$URL" \
            -o /tmp/base-files.deb

          echo
          echo "===== PACKAGE INFO ====="

          dpkg-deb -f /tmp/base-files.deb Package
          dpkg-deb -f /tmp/base-files.deb Version
          dpkg-deb -f /tmp/base-files.deb Architecture

          echo
          ls -lh /tmp/base-files.deb

          rm -f /tmp/base-files.deb


      # =========================================================
      # 6. FINAL VERIFY BEFORE BUILD
      # =========================================================
      - name: Verify X96 Mate configuration
        shell: bash
        run: |
          set -e

          echo "===== GIT ====="
          git log -1 --oneline

          echo
          echo "===== BOARD FILE ====="

          test -f config/boards/x96-mate.csc

          cat config/boards/x96-mate.csc

          echo
          echo "===== EXPECTED VALUES ====="

          grep 'BOARD_NAME="X96 Mate"' \
            config/boards/x96-mate.csc

          grep 'BOOTCONFIG="x96_q_ddr3_defconfig"' \
            config/boards/x96-mate.csc

          grep 'BOOT_FDT_FILE="allwinner/sun50i-h313-x96-q.dtb"' \
            config/boards/x96-mate.csc

          echo
          echo "X96 MATE CONFIG: OK"


      # =========================================================
      # 7. BUILD
      # =========================================================
      - name: Build Noble X96 Mate
        env:
          COLUMNS: "160"
          PREFER_DOCKER: "no"

        run: |
          PREFER_DOCKER=no ./compile.sh build \
            BOARD=x96-mate \
            BRANCH=edge \
            RELEASE=noble \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=xz


      # =========================================================
      # 8. SHOW BUILD RESULT
      # =========================================================
      - name: Show result
        if: always()
        run: |
          echo "===== DISK ====="
          df -h

          echo
          echo "===== IMAGES ====="

          find output/images \
            -maxdepth 1 \
            -type f \
            -ls 2>/dev/null || true


      # =========================================================
      # 9. UPLOAD IMAGE TO GITHUB ACTIONS
      # =========================================================
      - name: Upload X96 Mate image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X96Mate-Noble-6.12
          path: output/images/*
          retention-days: 7
